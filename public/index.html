    @import url('https://fonts.googleapis.com/css2?family=Fira+Sans&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');

    :root {
      --color-link: #000;
      --font-mono: "Fira Sans", sans-serif;
    }

    html {
      color: #000;
      font-size: 16px;
      font-family: var(--font-mono);
      font-weight: 400;
      letter-spacing: .0625em;
    }

    a {
      color: var(--color-link);
      text-decoration: none;
    }

    h1 {
      font-size: 4rem;
      line-height: 1.1;
      margin-block: 1.3lh 1lh;
      text-wrap: balance;
    }

    main {
      text-align: center;
      align-content: center;
      height: 66dvh;

      ul {
        list-style-type: none;
        padding: 0;
        margin: 0;

        &::before {
          content: "";
          display: inline-block;
          position: absolute;
          position-anchor: --li;
          inset: anchor(top) anchor(right) anchor(bottom) anchor(left);
          background: #EEEEEE;
          transition: .2s;
          z-index: -1;
          border-radius: 1rem;
        }


        li {
          display: inline-block;
          font-size: 2.5rem;
          margin: 0;
          padding: 0;

          &:is(:hover) {
            anchor-name: --li;
          }

          a {
            display: inline-block;
            margin: 0;
          }

          svg {
            padding: 1rem;
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: -0.175em;
          }
        }
      }
    }
  </style>
